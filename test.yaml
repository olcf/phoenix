architecture: x86_64
distro: rhel9
packagemanager: dnf
initfrom: scratch
initpackages:
  - dnf
  - bash
repos:
  rocky9: https://download.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/
steps:
  - recipe: rocky-base
  - package:
      - screen
      - golang
  - file: /etc/passwd
  - file:
      src: /root/hosts.mycluster
      dst: /etc/hosts
      chown: root:root
      chmod: "0644"
  - file:
      content: |
        nameserver 1.2.3.4
      dst: /etc/resolv.conf
  - command: systemd-firstboot --timezone=America/New_York --locale=en_US.UTF-8 --locale-messages=en_US.UTF-8

artifacts:
  - squashfs:
      output: {{version}}.squashfs
      include:
        - /opt/rocm-{{version}}
        - /etc/OpenCL/vendors
